services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    pids_limit: 10000
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - mariadb
    ports:
      - "14444:14444"

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "NsoRoot2026"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: "nsoshare"
      MARIADB_USER: "nso"
      MARIADB_PASSWORD: "NsoApp2026"
    volumes:
      - ./.dbdata:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "NsoRoot2026"
      UPLOAD_LIMIT: 512M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: 3600
    ports:
      - "8080:80"
